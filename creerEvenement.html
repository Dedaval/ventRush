<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vente Rush | Créer une annonce</title>
    <link rel="stylesheet" href="assets/lib/bootstrap/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <a class="navbar-brand" href="index.html">Vente Rush</a>
            <div class="navbar-nav">

            </div>
        </nav>

    <div class="container mt-5">
        <h2 class="titre">Créer un événements</h2>
        <form id="create-ad-form">
            <div class="mb-3">
                <label for="evenement-nom" class="form-label">Nom</label>
                <input type="text" class="form-control" id="evenement-nom" minlength="2" required>
                <p id="error-evenement-nom" class="alert alert-danger" role="alert"style="display: none;"></p>
            </div>
            <div class="mb-3">
                <label for="evenement-date" class="form-label">Date</label>
                <input type="date" id="evenement-date" class="form-control">
                <p id="error-evenement-date" class="alert alert-danger" role="alert"style="display: none;"></p>
            </div>
            <div class="mb-3">
                <label for="evenement-description" class="form-label">Description</label>
                <textarea class="form-control" id="evenement-description" rows="3"></textarea>
                <p id="error-evenement-description" class="alert alert-danger" role="alert"style="display: none;"></p>
            </div>
            <div class="mb-3">
                <label for="evenement-nbMaxParticipant" class="form-label">Nombre max de participant</label>
                <input type="number" id="evenement-nbMaxParticipant" class="form-control">
                <p id="error-evenement-nbMaxParticipant" class="alert alert-danger" role="alert"style="display: none;"></p>
            </div>
            <button type="submit" id="submit" class="btn btn-primary">Créer</button>
        </form>
    </div>

    <script src="assets/lib/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/creerEvenement.js" type="module" defer></script>
    <script src="assets/js/main.js" type="module"></script>
</body>
</html>
